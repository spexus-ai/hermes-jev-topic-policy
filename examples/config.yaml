gateway:
  multiplex_profiles: false
group_sessions_per_user: true
thread_sessions_per_user: true

document_qa:
  enabled: true
  corpus_file: documents.json
  model_endpoint: https://api.openai.com/v1/chat/completions
  model: REPLACE_WITH_CHAT_COMPLETIONS_MODEL
  api_key_env: OPENAI_API_KEY
  policy_version: product-x-v1
  model_timeout_seconds: 45
  max_concurrent: 4
  requests_per_user_minute: 6
  requests_per_minute: 60

message_gates:
  required:
    before_model_request: [jev-topic-policy]
    before_response_delivery: [jev-topic-policy]
  on_error: deny
  stage_deadline_seconds: 10
  templates:
    off_topic: Я отвечаю только на вопросы об установке и использовании продукта X.
    no_answer: В доступной документации нет ответа на этот вопрос.
    output_rejected: Не удалось подготовить ответ в рамках документации.
    unavailable: Проверка запроса временно недоступна. Попробуйте позже.
    busy: Слишком много запросов. Попробуйте позже.
    unsupported: Отправьте текстовый вопрос. Команды и вложения не поддерживаются.

plugins:
  enabled: [jev-topic-policy]
  entries:
    jev-topic-policy:
      settings:
        policy_file: topic-policy.yaml
        api_key_env: TYPESAFE_API_KEY
        experimental: true  # Only for initial testing; remove after calibration.
